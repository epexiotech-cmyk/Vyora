appId: com.vyora.desktop
productName: Vyora
npmRebuild: false
directories:
  output: dist-installers
  buildResources: build
files:
  - dist-electron/**/*
  - renderer/out/**/*
  - package.json
  - assets/**/*
asarUnpack:
  - "**/*.node"
extraResources:
  - from: "resources"
    to: "resources"
  - from: "../../packages/database/drizzle"
    to: "assets/drizzle"
  - from: "assets"
    to: "assets"
win:
  target: 
    - nsis
    - portable
  icon: "assets/icons/Vyora Logo.ico"
mac:
  target: dmg
  icon: build/icon.icns
linux:
  target: AppImage
  icon: build/icon.png
