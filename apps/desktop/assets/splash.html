<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loading Vyora...</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: transparent;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        overflow: hidden;
        -webkit-app-region: drag; /* Allows moving the window */
      }
      img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
    </style>
  </head>
  <body>
    <!-- Display the animated SVG -->
    <img src="./VYORA SPLASH.svg" alt="Vyora Splash" draggable="false" />

    <script>
      // The SVG shine sweep animation finishes roughly around 4.0s
      // We will fire the custom event slightly before that to begin transition
      setTimeout(() => {
        window.dispatchEvent(new CustomEvent('splash-finished'));
      }, 3800);

      window.addEventListener('splash-finished', () => {
        if (window.vyora?.splash?.finished) {
          window.vyora.splash.finished();
        }
      });
    </script>
  </body>
</html>
